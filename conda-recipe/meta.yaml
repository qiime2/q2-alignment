package:
  name: q2-alignment
  version: {{ PLUGIN_VERSION }}
source:
  path: ..
build:
  script: make install
requirements:
  host:
  - python {{ python }}
  - setuptools
  - versioningit
  - wheel
  run:
  - python {{ python }}
  - scikit-bio {{ scikit_bio }}
  - qiime2 {{ qiime2_epoch }}.*
  - q2-types {{ qiime2_epoch }}.*
  - mafft {{ mafft }}
  build:
  - python {{ python }}
  - setuptools
  - versioningit
test:
  requires:
  - qiime2 >={{ qiime2 }}
  - q2-types >={{ q2_types }}
  - pytest
  imports:
  - q2_alignment
  - qiime2.plugins.alignment
  commands:
  - py.test --pyargs q2_alignment
about:
  home: https://qiime2.org
  license: BSD-3-Clause
  license_family: BSD
